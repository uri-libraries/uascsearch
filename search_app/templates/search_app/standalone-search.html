<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Special Collections - XML Archives Search</title>
    <style>
        /* Clean, minimal styling for iframe embedding */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 20px; }
        .search-container { max-width: 800px; margin: 0 auto; }
        .search-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 4px; }
        .search-button { padding: 12px 24px; background: #0073aa; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-button:hover { background: #005a87; }
        .result-item { background: white; padding: 15px; margin-bottom: 15px; border-left: 4px solid #0073aa; }
        .result-title a { color: #0073aa; text-decoration: none; font-weight: bold; }
        .result-snippet { color: #666; margin: 8px 0; }
        .result-dublin-core { color: #555; font-size: 0.9em; margin: 8px 0; }
        .result-meta { font-size: 0.9em; color: #999; }
        .loading, .error { text-align: center; padding: 20px; }
        .error { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
    </style>
</head>
<body>
    <div class="search-container">
        <form class="search-form" onsubmit="performSearch(event)">
            <input type="text" class="search-input" id="searchInput" placeholder="Search manuscripts and archives..." required>
            <button type="submit" class="search-button">Search</button>
        </form>
        <div id="results-container"></div>
    </div>

    <script>
        // Use relative URL for same-origin requests
        const API_BASE_URL = window.location.origin;
        
        async function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/search/?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                displayResults(data, query);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="error">Search failed. Please try again.</div>';
            }
        }
        
        function displayResults(data, query) {
            const resultsContainer = document.getElementById('results-container');
            const count = data.count || 0;
            const results = data.results || [];

            if (count === 0) {
                resultsContainer.innerHTML = `<div class="error">No results found for "${query}"</div>`;
                return;
            }

            let html = `<p>Found ${count} result(s) for "${query}"</p>`;
            results.forEach(result => {
                let title = result.title || result.filename || '';
                title = decodeURIComponent(title).replace(/\.xml$/i, '').replace(/_/g, ' ').trim();
                if (title.length > 80) title = title.substring(0, 77) + '...';
                const dublinCore = result.dublin_core || {};
                const fields = [
                    ['Creator', dublinCore.creator],
                    ['Date', dublinCore.date],
                    ['Subject', dublinCore.subject],
                    ['Identifier', dublinCore.identifier]
                ].filter(([, values]) => values && values.length)
                    .map(([label, values]) => `<strong>${label}:</strong> ${escapeHtml(values.join('; '))}`)
                    .join(' | ');

                html += `
                    <div class="result-item">
                        <div class="result-title">
                            <a href="${result.url}" target="_blank">${title}</a>
                        </div>
                        <div class="result-snippet">${result.snippet}</div>
                        ${fields ? `<div class="result-dublin-core">${fields}</div>` : ''}
                        <div class="result-meta">
                            ${result.file_size ? formatFileSize(result.file_size) : ''} | 
                            ${result.last_modified ? new Date(result.last_modified).toLocaleDateString() : ''}
                        </div>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
        }

        function escapeHtml(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
